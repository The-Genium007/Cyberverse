name: build-client
# Compile le client Cyberverse porté (plugin RED4ext) en .dll Windows, dans le cloud.
# GNS via vcpkg (manifest mode) AVEC cache binaire GitHub Actions → GNS compilé une seule
# fois, réutilisé aux runs suivantes. SDK/red-lib via submodules. Upload du .dll en artefact.

on:
  push:
    branches: [ port/2.31 ]
    paths:
      - 'client/red4ext/**'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MSVC dev env (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Variables cache GHA pour vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: VCPKG_ROOT depuis le runner
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configurer (Ninja + vcpkg, Release)
        working-directory: client/red4ext
        run: cmake --preset ninja-vcpkg -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        working-directory: client/red4ext
        run: cmake --build --preset ninja-vcpkg

      - name: Rassembler l'overlay (plugin + DLL runtime dans bin/x64)
        shell: pwsh
        run: |
          $plug = "staging/red4ext/plugins/Cyberverse"
          $bin  = "staging/bin/x64"
          New-Item -ItemType Directory -Force -Path $plug,$bin | Out-Null
          # plugin → red4ext/plugins/Cyberverse/
          $dll = Get-ChildItem -Recurse client/red4ext/build -Filter Cyberverse.Red4Ext.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "Plugin DLL introuvable"; exit 1 }
          Copy-Item $dll.FullName $plug/
          Write-Host "Plugin : $($dll.FullName)  ($($dll.Length) o)"
          # DLL runtime → bin/x64/ (à côté de l'exe = sur le chemin de recherche DLL).
          # libprotoc (compilateur protobuf) exclu : inutile au runtime, ~10 Mo.
          $vbin = Get-ChildItem -Recurse client/red4ext/build -Directory -Filter bin |
                  Where-Object { $_.FullName -like "*vcpkg_installed*" -and $_.FullName -like "*x64-windows*" -and $_.FullName -notlike "*debug*" -and $_.FullName -notlike "*static*" } |
                  Select-Object -First 1
          if (-not $vbin) { Write-Error "vcpkg bin introuvable"; exit 1 }
          Get-ChildItem $vbin.FullName -Filter *.dll | Where-Object { $_.Name -ne 'libprotoc.dll' } | ForEach-Object {
            Copy-Item $_.FullName $bin/; Write-Host "Runtime → bin/x64 : $($_.Name)"
          }
          Write-Host "=== overlay final ==="; Get-ChildItem -Recurse staging | Select-Object FullName, Length

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: cyberverse-client-overlay
          path: staging/**
          if-no-files-found: error
