name: build-client
# Compile le client Cyberverse porté (plugin RED4ext) en .dll Windows, dans le cloud.
# GNS via vcpkg (manifest mode) AVEC cache binaire GitHub Actions → GNS compilé une seule
# fois, réutilisé aux runs suivantes. SDK/red-lib via submodules. Upload du .dll en artefact.

on:
  push:
    branches: [ port/2.31 ]
    paths:
      - 'client/red4ext/**'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MSVC dev env (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Variables cache GHA pour vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: VCPKG_ROOT depuis le runner
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configurer (Ninja + vcpkg, Release)
        working-directory: client/red4ext
        run: cmake --preset ninja-vcpkg -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        working-directory: client/red4ext
        run: cmake --build --preset ninja-vcpkg

      - name: Rassembler l'overlay (plugin + DLL runtime GNS)
        shell: pwsh
        run: |
          $dest = "staging/red4ext/plugins/Cyberverse"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # 1) le plugin
          $dll = Get-ChildItem -Recurse client/red4ext/build -Filter Cyberverse.Red4Ext.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "Plugin DLL introuvable"; exit 1 }
          Copy-Item $dll.FullName $dest/
          Write-Host "Plugin : $($dll.FullName)  ($($dll.Length) o)"
          # 2) DLL runtime depuis vcpkg_installed (GNS + deps : openssl, protobuf, abseil...)
          $bin = Get-ChildItem -Recurse client/red4ext/build -Directory -Filter bin |
                 Where-Object { $_.FullName -like "*vcpkg_installed*" -and $_.FullName -like "*x64-windows*" -and $_.FullName -notlike "*debug*" } |
                 Select-Object -First 1
          if (-not $bin) { Write-Error "vcpkg_installed/x64-windows/bin introuvable"; exit 1 }
          Get-ChildItem $bin.FullName -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName $dest/; Write-Host "Runtime : $($_.Name)"
          }
          Write-Host "=== overlay final ==="; Get-ChildItem -Recurse staging | Select-Object FullName, Length

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: cyberverse-client-overlay
          path: staging/**
          if-no-files-found: error
