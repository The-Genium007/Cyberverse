name: build-client
# Compile le client Cyberverse porté (plugin RED4ext) en .dll Windows, dans le cloud.
# GNS via vcpkg + cache binaire FICHIER (actions/cache) -> GNS compile une fois puis restaure
# (~2-3 min au lieu de ~25). SDK/red-lib via submodules. Upload du .dll en artefact.

on:
  push:
    branches: [ port/2.31 ]
    paths:
      - 'client/red4ext/**'
      - 'client/RedscriptModule/**'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier une release netcode-v* sur The-Genium007/distribution"
        type: boolean
        default: false
      version:
        description: "Version a publier (ex: 0.1.1) — requise si publish=true"
        default: ""

# Un nouveau push annule le build en cours sur la meme ref (evite les runs redondants).
concurrency:
  group: build-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      # vcpkg ecrit/lit ses archives binaires ici (provider 'files' par defaut, readwrite).
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MSVC dev env (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preparer le dossier de cache binaire vcpkg
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache binaire vcpkg (GNS + deps)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-bincache
          key: vcpkg-x64-windows-${{ hashFiles('client/red4ext/vcpkg.json') }}
          restore-keys: |
            vcpkg-x64-windows-

      - name: VCPKG_ROOT depuis le runner
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configurer (Ninja + vcpkg, Release)
        working-directory: client/red4ext
        run: cmake --preset ninja-vcpkg -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        working-directory: client/red4ext
        run: cmake --build --preset ninja-vcpkg

      - name: Rassembler l'overlay (plugin + DLL runtime dans bin/x64)
        shell: pwsh
        run: |
          $plug = "staging/red4ext/plugins/Cyberverse"
          $bin  = "staging/bin/x64"
          New-Item -ItemType Directory -Force -Path $plug,$bin | Out-Null
          # plugin -> red4ext/plugins/Cyberverse/
          $dll = Get-ChildItem -Recurse client/red4ext/build -Filter Cyberverse.Red4Ext.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "Plugin DLL introuvable"; exit 1 }
          Copy-Item $dll.FullName $plug/
          Write-Host "Plugin : $($dll.FullName)  ($($dll.Length) o)"
          # DLL runtime -> bin/x64/ (a cote de l'exe = sur le chemin de recherche DLL).
          # libprotoc (compilateur protobuf) exclu : inutile au runtime, ~10 Mo.
          $vbin = Get-ChildItem -Recurse client/red4ext/build -Directory -Filter bin |
                  Where-Object { $_.FullName -like "*vcpkg_installed*" -and $_.FullName -like "*x64-windows*" -and $_.FullName -notlike "*debug*" -and $_.FullName -notlike "*static*" } |
                  Select-Object -First 1
          if (-not $vbin) { Write-Error "vcpkg bin introuvable"; exit 1 }
          Get-ChildItem $vbin.FullName -Filter *.dll | Where-Object { $_.Name -ne 'libprotoc.dll' } | ForEach-Object {
            Copy-Item $_.FullName $bin/; Write-Host "Runtime -> bin/x64 : $($_.Name)"
          }
          # Module redscript -> r6/scripts/Cyberverse/ : le plugin natif ne suffit pas, ces deux
          # fichiers declarent le NetworkGameSystem cote script (visibles en tete du log de
          # compilation redscript au lancement du jeu). Sans eux le netcode ne se charge pas.
          #
          # Ils manquaient a cet artefact : le zip netcode-v0.1.0 publie le 2026-06-29 avait donc
          # ete complete A LA MAIN. Un artefact incomplet ne peut pas etre publie automatiquement
          # -> le netcode n'a jamais ete republie -> il a derive 2 semaines derriere le schema,
          # jusqu'a rendre le jeu injouable (kick protocol_version, 2026-07-15). L'artefact est
          # desormais auto-suffisant : il correspond exactement au contenu de cyberverse-client.zip.
          #
          # ⚠️ Cyberverse.reds N'EST PLUS EXCLU depuis le 2026-08-22, et c'est un RENVERSEMENT.
          #
          # Il l'etait sur un constat — « il n'est pas dans le zip publie (verifie le 2026-07-15) »
          # — transforme en regle. Or il declare `TesseraLobbyValide` sur `DebugDataDef`
          # (Cyberverse.reds:22), et le parcours d'entree promu dans tessera-uikit ECRIT ce champ.
          # Sans ce fichier, `UiKitLobbyNatif.reds` ne resout pas, et redscript fait alors tomber
          # TOUT r6/scripts : le joueur n'a pas « un lobby en moins », il a un jeu qui ne demarre
          # plus du tout.
          #
          # Il vit a la racine de src/, pas sous src/Network/ — d'ou la copie separee ci-dessous.
          $reds = "staging/r6/scripts/Cyberverse"
          New-Item -ItemType Directory -Force -Path $reds | Out-Null
          #
          # ⚠️ Liste NOMINATIVE et non un glob de src/Network/ : CrowdProbe.reds y vit aussi et
          # c'est une SONDE de recherche, qui n'a rien a faire chez un joueur. Tout .reds de
          # production ajoute dans src/Network/ doit donc etre ajoute ici, sinon il est deploye a
          # la main sur le poste de dev et n'atteint jamais les joueurs.
          # ⚠️ QUATRE FICHIERS AJOUTES LE 2026-08-22. Le fork portait 14 .reds, cette liste
          # en nommait 6 : ArmeAvatar (armes vues par les autres joueurs), PoliceOff,
          # Promotion (ADR 0022) et StimObserver etaient de la PRODUCTION deployee a la main
          # sur le poste de dev, et n'atteignaient aucun joueur. C'est exactement ce que le
          # commentaire ci-dessus annoncait qu'il arriverait.
          #
          # RESTENT DEHORS, et c'est voulu : AppearanceProbe, ChuteProbe et CrowdProbe. Leur
          # bandeau dit « SONDE » — elles mesurent et journalisent, elles n'ont rien a faire
          # chez un joueur.
          # ⚠️ CINQ FICHIERS AJOUTÉS LE 2026-08-27, et c'est LA MÊME PANNE QUE LE 2026-08-22.
          #
          # Le fork portait alors 14 `.reds` et cette liste en nommait six ; quatre ont été ajoutés
          # ce jour-là. Quatre jours plus tard, cinq nouveaux fichiers de production étaient
          # retombés dans le même trou — parce que la liste est NOMINATIVE et que rien, dans le
          # geste d'écrire un `.reds`, ne rappelle son existence.
          #
          #   HabillageAvatar   — l'avatar distant porte les vêtements décidés par le serveur.
          #                       Sans lui, chaque joueur voit les autres en tenue par défaut.
          #   ReglesServeur     — les règles de l'opérateur (dont la coupure des PNJ hostiles).
          #   VehiculeCoffre    — le contenu du coffre, sous autorité serveur.
          #   VehiculeDegats    — la casse partagée entre joueurs, et sa fenêtre de calme.
          #   VehiculeInvocation— la sortie de véhicule par la recette native d'invocation.
          #
          # ⚠️ CE QUI REND CE TROU SI COÛTEUX : IL EST INVISIBLE EN DÉVELOPPEMENT. Le poste de dev
          # déploie tout `src/Network/` à la main, donc tout marche ici — et seul un joueur réel
          # découvre l'absence. Un test in-game ne peut PAS l'attraper. C'est ce fichier, ou rien.
          foreach ($f in @('NetworkGameSystem.reds', 'PlayerActionTracker.reds', 'AvatarNeutre.reds', 'LootOff.reds', 'DegatsPvp.reds', 'SanteLocale.reds', 'ArmeAvatar.reds', 'PoliceOff.reds', 'Promotion.reds', 'StimObserver.reds', 'HabillageAvatar.reds', 'ReglesServeur.reds', 'VehiculeCoffre.reds', 'VehiculeDegats.reds', 'VehiculeInvocation.reds')) {
            $src = "client/RedscriptModule/src/Network/$f"
            if (-not (Test-Path $src)) { Write-Error "Module redscript introuvable : $src"; exit 1 }
            Copy-Item $src $reds/; Write-Host "Redscript -> r6/scripts/Cyberverse : $f"
          }
          # Cyberverse.reds : racine de src/, donc hors de la boucle ci-dessus.
          $racine = 'client/RedscriptModule/src/Cyberverse.reds'
          if (-not (Test-Path $racine)) { Write-Error "Module redscript introuvable : $racine"; exit 1 }
          Copy-Item $racine $reds/; Write-Host "Redscript -> r6/scripts/Cyberverse : Cyberverse.reds"
          Write-Host "=== overlay final ==="; Get-ChildItem -Recurse staging | Select-Object FullName, Length

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: cyberverse-client-overlay
          path: staging/**
          if-no-files-found: error

      # ── Publication netcode-v* (declenchee a la main) ─────────────────────────────────────
      # Ferme la boucle qui a rendu le jeu injouable le 2026-07-15 : release.yml (monorepo
      # Tessera) consomme le netcode via une release `netcode-v*` sur The-Genium007/distribution
      # (modset.packages.toml : `source = "netcode"`), mais RIEN ne la produisait — le zip
      # netcode-v0.1.0 avait ete assemble et uploade a la main le 2026-06-29, puis plus jamais.
      # Le netcode est donc le SEUL package du modset qui ne suit pas le depot : tous les autres
      # sont des overlays relus a chaque package-dev. Il a derive 2 semaines derriere le schema
      # (protocol_version ajoute le 07-13) jusqu'au kick systematique au Join.
      #
      # Declenchement MANUEL (workflow_dispatch + publish=true) et pas a chaque push : publier
      # une release a chaque commit de la branche de travail creerait du bruit et des versions
      # jamais epinglees. Le flux : pousser -> verifier que le build passe -> republier quand le
      # protocole a bouge.
      #
      # Apres publication, cote monorepo : release.yml prend AUTOMATIQUEMENT la netcode-v* la plus
      # haute (tri sort -V, cf. l'etape « Recuperer l'overlay netcode epingle »). Rien a epingler
      # a la main, mais il FAUT un package-dev + promote pour que les joueurs la recoivent.
      - name: Publier la release netcode-v* (distribution)
        if: inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          [ -n "$V" ] || { echo "::error::version vide — renseigner l'entree 'version' (ex: 0.1.1)"; exit 1; }
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::secret DISTRIBUTION_TOKEN absent de ce depot — requis pour creer la release sur The-Genium007/distribution"; exit 1; }

          # Le zip DOIT avoir les chemins enracines a la racine du jeu (bin/x64/..., r6/...,
          # red4ext/...) : tessera-release les recopie tels quels dans l'install. Zipper depuis
          # staging/ garantit exactement ca.
          cd staging
          7z a -tzip ../cyberverse-client.zip . >/dev/null
          cd ..
          echo "=== contenu du zip publie ==="
          7z l cyberverse-client.zip | tail -n +18

          gh release create "netcode-v${V}" cyberverse-client.zip \
            --repo The-Genium007/distribution \
            --title "netcode-v${V} — overlay Cyberverse (port 2.31)" \
            --notes "Overlay netcode consomme par release.yml (build-composition, \`source=\"netcode\"\`).

          Build : ${{ github.sha }} (branche \`${{ github.ref_name }}\`, run ${{ github.run_id }}).
          Contenu : plugin RED4ext + DLL runtime (GNS/protobuf/abseil/openssl) + module redscript
          \`r6/scripts/Cyberverse/\`.

          Rappel : ceci ne suffit pas a livrer les joueurs — lancer ensuite \`release.yml\`
          (package-dev puis promote) sur le monorepo pour composer et publier le modset." \
          || gh release upload "netcode-v${V}" cyberverse-client.zip \
            --repo The-Genium007/distribution --clobber
          echo "::notice::netcode-v${V} publiee — lancer maintenant release.yml (package-dev + promote) sur le monorepo"
